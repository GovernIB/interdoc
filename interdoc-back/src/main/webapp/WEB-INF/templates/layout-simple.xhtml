<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui"
    lang="#{userLocale.current.toLanguageTag()}">
<!--
Plantilla simple sense header per pàgines de registre.
-->
<f:view locale="#{userLocale.current}">
    <ui:insert name="metadata" />
    <h:head>
        <f:facet name="first">
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <title><ui:insert name="pageTitle" /></title>
            <link rel="shortcut icon" href="#{resource['img/GOIB_fav.png']}" />
        </f:facet>
        <h:outputScript name="js/bootstrap.min.js" />
        <script src="#{resource['js/primefaceslocale_' += userLocale.current.toLanguageTag() += '.js']}"
            type="text/javascript"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"></link>
    </h:head>
    <h:body>
        <h:outputStylesheet name="css/bootstrap.min.css" />
        <h:outputStylesheet name="css/open-iconic-bootstrap.css" />
        <h:outputStylesheet name="css/styles.css" />

        <p:growl id="messages" globalOnly="false" showDetail="true" life="5000" escape="false" />

        <h:form>
            <p:confirmDialog global="true">
                <p:commandButton value="#{labels.button_si}" type="button" styleClass="ui-confirmdialog-yes"
                    icon="ui-icon-check" />
                <p:commandButton value="#{labels.button_no}" type="button" styleClass="ui-confirmdialog-no"
                    icon="ui-icon-close" />
            </p:confirmDialog>
        </h:form>

        <!-- Content -->
        <div class="container p-3aplicacio">
            <div class="my-3 p-3 bg-white rounded box-shadow">
                <div class="card mb-12 border-0">
                    <span class="h5 card-title border-bottom verde"> <ui:insert name="pageTitle">Interdoc</ui:insert>
                    </span>
                    <ui:insert name="content" />
                </div>
            </div>
        </div>
        <!-- FI Content -->

        <ui:include src="/WEB-INF/includes/footer.xhtml" />
    </h:body>
</f:view>
</html>

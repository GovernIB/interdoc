<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">
<ui:composition>

	<!-- PluginId -->
	<ui:decorate template="/WEB-INF/decorations/field.xhtml">
		<p:inputText id="id" value="#{pluginModel.value.id}" type="hidden" />
	</ui:decorate>

	<!-- Nom -->
	<ui:decorate template="/WEB-INF/decorations/field.xhtml">
		<ui:define name="label">
			<p:outputLabel for="nom" value="#{labels.plugin_nom}" />
		</ui:define>
		<ui:define name="input">
			<p:inputText id="nom" value="#{pluginModel.value.nom}" />
			<p:message for="nom" />
		</ui:define>
	</ui:decorate>

	<!-- Classe -->
	<ui:decorate template="/WEB-INF/decorations/field.xhtml">
		<ui:define name="label">
			<p:outputLabel for="classe" value="#{labels.plugin_classe}" />
		</ui:define>
		<ui:define name="input">
			<p:inputText id="classe" value="#{pluginModel.value.classe}" />
			<p:message for="classe" />
		</ui:define>
	</ui:decorate>

	<!-- Propietats -->
	<div class="row">
		<div class="col-md-12 col-center">
			<div class="form-group">
				<div class="input-group">
					<div class="col-md-2">
						<p:outputLabel for="propietats" value="#{labels.plugin_propietats}" />
					</div>
					<div class="col-md-10">
						<p:inputTextarea id="propietats" rows="10"
							value="#{pluginModel.value.propietats}" pt:wrap="off"
							style="width: 100%; max-width: 1600px; overflow-x: auto; resize: horizontal; font-family: Consolas, 'Courier New', monospace;" />
						<p:message for="propietats" />
					</div>
				</div>
			</div>
		</div>
	</div>

    <!--  EntitatId -->
    <ui:decorate template="/WEB-INF/decorations/field.xhtml">
        <ui:define name="label">
            <p:outputLabel for="entitatid" value="#{labels.plugin_entitatid}" />
        </ui:define>
        <ui:define name="input">
            <p:inputText id="entitatid" value="#{edit ? editPlugin.entitatNom : newPlugin.entitatNom}" 
                         readonly="true" disabled="true" styleClass="ui-state-disabled"/>
            <p:inputText value="#{pluginModel.value.entitatId}" type="hidden" />
            <p:message for="entitatid" />
        </ui:define>
    </ui:decorate>
    
    <!-- Tipus -->
    <ui:decorate template="/WEB-INF/decorations/field.xhtml">
        <ui:define name="label">
            <p:outputLabel for="tipus" value="#{labels.plugin_tipus}" />
        </ui:define>
        <ui:define name="input">
            <p:selectOneMenu id="tipus" value="#{pluginModel.value.tipus}">
                <f:selectItem itemLabel="#{labels.desplegable}" itemValue="#{null}" noSelectionOption="true"/>
                <f:selectItem itemLabel="#{labels.plugin_tipus_arxiu}" itemValue="#{constants.PLUGIN_ARXIU}"/>
                <f:selectItem itemLabel="#{labels.plugin_tipus_firma}" itemValue="#{constants.PLUGIN_FIRMA}"/>
            </p:selectOneMenu>
            <p:message for="tipus" />
        </ui:define>
    </ui:decorate>
    
	<!-- Actiu -->
	<ui:decorate template="/WEB-INF/decorations/field.xhtml">
		<ui:define name="label">
			<p:outputLabel for="actiu" value="#{labels.plugin_actiu}" />
		</ui:define>
		<ui:define name="input">
			<p:selectOneMenu id="actiu" value="#{pluginModel.value.actiu}">
				<f:selectItems value="#{estats.values()}" var="estat" />
			</p:selectOneMenu>
			<p:message for="actiu" />
		</ui:define>
	</ui:decorate>


	<!-- DataCreacio -->
	<ui:decorate template="/WEB-INF/decorations/field.xhtml">
		<ui:define name="label">
			<p:outputLabel for="dataCreacio" value="#{labels.plugin_dataCreacio}" />
		</ui:define>
		<ui:define name="input">
			<p:inputText id="dataCreacio"
				value="#{pluginModel.value.dataCreacio}" 
				readonly="true" disabled="true" styleClass="ui-state-disabled">
				<f:convertDateTime pattern="dd-MM-yyyy" type="localDate" />
			</p:inputText>
			<p:message for="dataCreacio" />
		</ui:define>
	</ui:decorate>

</ui:composition>
</html>

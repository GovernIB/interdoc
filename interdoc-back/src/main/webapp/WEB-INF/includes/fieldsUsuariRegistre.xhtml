<html xmlns="http://www.w3.org/1999/xhtml"

<ui:composition>

    <!-- AplicacioId -->
    <ui:decorate template="/WEB-INF/decorations/field.xhtml">
            <p:inputText id="id" value="#{usuariModel.value.id}" type="hidden"/>

    <ui:decorate template="/WEB-INF/decorations/field.xhtml">
        <ui:define name="label">
            <p:outputLabel for="username" value="#{labels.usuari_username}"/>
        </ui:define>
        <ui:define name="input">
            <p:inputText id="username" value="#{usuariModel.value.username}" readonly="true" disabled="true"/>

        </ui:define>
    </ui:decorate>

    </ui:define>
    <ui:define name="input">  
        <p:selectOneMenu id="idiomaId" value="#{usuariModel.value.idiomaId}">

</ui:decorate>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<!--
Pàgina per registre d'usuaris nous.
-->
<ui:composition template="/WEB-INF/templates/layout-simple.xhtml">

    <ui:define name="pageTitle">
        #{labels.registrarUsuari_title}
    </ui:define>

    <ui:define name="content">

        <h:form id="form">

            <ui:include src="/WEB-INF/includes/fieldsUsuariRegistre.xhtml">
                <ui:param name="edit" value="false" />
            </ui:include>

            <ui:decorate template="/WEB-INF/decorations/buttons.xhtml">
                <ui:define name="buttons">
                    <p:commandButton id="saveButton" action="#{registrarUsuari.save}"
                                    value="#{labels.button_guardar}"
                                    process="@form" update="@form"/>
                </ui:define>
            </ui:decorate>
        </h:form>

    </ui:define>
</ui:composition>
</html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<!--
Pàgina d'error per usuaris no registrats a la base de dades
-->
<ui:composition template="/WEB-INF/templates/errorLayout.xhtml">
    <ui:define name="pageTitle">Usuari no registrat</ui:define>
    <ui:define name="content">
        <p class="card-text mb-5 lh15">
            Aquest usuari no esta registrat. Parli amb el seu administrador perque el doni d'alta.
            <br /><br />
            <p:commandButton action="#{logout.logout}" value="#{labels.sortir_link}" />
        </p>
    </ui:define>
</ui:composition>
</html>

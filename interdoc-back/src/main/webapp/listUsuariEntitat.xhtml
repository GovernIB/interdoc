<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<!--
    Pàgina amb el llistat d'usuaris.
    -->
<ui:composition template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="metadata">
        <f:metadata>
            <f:importConstants type="es.caib.interdoc.service.model.Estat" var="estats" />
            <!-- Guard per verificar accés a pàgina restringida -->
            <f:event type="preRenderView" listener="#{userLocale.requireSuperAdmin()}" />
        </f:metadata>
    </ui:define>

    <ui:define name="pageTitle">#{labels.listUsuariEntitat_title}</ui:define>

    <ui:define name="breadcrumb">
        <p:menuitem value="#{labels.listUsuariEntitat_link}" outcome="/listUsuariEntitat" />
    </ui:define>

    <ui:define name="content">
        <p>
            <h:form>
                <p:dataTable id="dataTable" value="#{listUsuariEntitat.lazyModel}" var="usuariEntitat" sortMode="multiple"
                    paginator="true" lazy="true" filterDelay="300" widgetVar="unitatsTable" rows="10"
                    rowsPerPageTemplate="10,20,50,100" paginatorPosition="bottom" paginatorAlwaysVisible="false"
                    paginatorTemplate="{RowsPerPageLabel} {RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport}
                             {NextPageLink} {LastPageLink}"
                    currentPageReportTemplate="#{labels.dataTable_currentPageReport}"
                    emptyMessage="#{labels.dataTable_emptyMessage}">
                    <f:facet name="{RowsPerPageLabel}">
                        #{labels.dataTable_rowsPerPage}
                    </f:facet>
                                        
                    <p:column filterBy="#{usuariEntitat.username}" sortBy="#{usuariEntitat.username}">
                        <f:facet name="header">#{labels.usuariEntitat_username}</f:facet>
                        <h:outputText value="#{usuariEntitat.username}" />
                    </p:column>
                    
                    <p:column filterBy="#{usuariEntitat.entitatNom}" sortBy="#{entitat.entitatNom}">
                        <f:facet name="header">#{labels.usuariEntitat_entitatNom}</f:facet>
                        <h:outputText value="#{usuariEntitat.entitatNom}" />
                    </p:column>
                    
                    <p:column filterBy="#{usuariEntitat.actiu}" sortBy="#{usuariEntitat.actiu}">
                        <f:facet name="header">#{labels.usuariEntitat_actiu}</f:facet>
                        <h:outputText value="#{usuariEntitat.actiu}" />
                    </p:column>

                    <p:column>
                        <f:facet name="header"></f:facet>
                        <p:menuButton value="#{labels.button_opcions}">
                            <c:if test="#{security.admin}">
                                <p:menuitem value="#{labels.button_editar}" outcome="/admin/editUsuariEntitat">
                                    <f:param name="usuariEntitatId" value="#{usuariEntitat.usuariEntitatId}" />
                                </p:menuitem>
                                <p:menuitem value="#{labels.button_eliminar}" action="#{listUsuariEntitat.delete(usuariEntitat.usuariEntitatId)}"
                                    update="messages @form">
                                    <p:confirm message="#{labels.confirm_eliminar}" />
                                </p:menuitem>
                            </c:if>
                        </p:menuButton>
                    </p:column>
                </p:dataTable>
            </h:form>
        </p>
        <c:if test="#{security.admin}">
            <p>
                <p:button value="#{labels.newUsuariEntitat_link}" outcome="/admin/newUsuariEntitat" />
            </p>
        </c:if>
    </ui:define>
</ui:composition>
</html>

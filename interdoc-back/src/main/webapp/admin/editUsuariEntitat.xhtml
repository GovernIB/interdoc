<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<!--
Pàgina per edició d'unitats orgàniques.
-->
<ui:composition template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam id="usuariEntitatId" name="usuariEntitatId" value="#{usuariEntitatModel.value.usuariEntitatId}" />
            <f:viewAction action="#{usuariEntitatModel.load}"/>
            <f:importConstants type="es.caib.interdoc.service.model.Estat" var="estats"/>
        </f:metadata>
    </ui:define>

    <ui:define name="pageTitle">
        #{labels.editUsuariEntitat_title}
    </ui:define>

    <ui:define name="breadcrumb">
        <p:menuitem value="#{labels.listUsuariEntitat_link}" outcome="/listUsuariEntitat"/>
        <p:menuitem value="#{labels.editUsuariEntitat_link}" outcome="/admin/editUsuariEntitat" includeViewParams="true"/>
    </ui:define>

    <ui:define name="content">

        <h:form id="form">

            <ui:include src="/WEB-INF/includes/fieldsUsuariEntitat.xhtml">
                <ui:param name="edit" value="true" />
            </ui:include>

            <ui:decorate template="/WEB-INF/decorations/buttons.xhtml">
                <ui:define name="buttons">
                    <p:commandButton id="updateButton" action="#{editUsuariEntitat.update}"
                                     value="#{labels.button_guardar}"
                                     process="@form" update="@form"/>
                    <p:button value="#{labels.button_tornar}" outcome="/listUsuariEntitat"
                              styleClass="float-right"/>
                </ui:define>
            </ui:decorate>
        </h:form>

    </ui:define>
</ui:composition>
</html>

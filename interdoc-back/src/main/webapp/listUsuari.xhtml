<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<!--
    Pàgina amb el llistat d'usuaris.
    -->
<ui:composition template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="metadata">
        <f:metadata>
            <f:importConstants type="es.caib.interdoc.service.model.Estat" var="estats" />
        </f:metadata>
    </ui:define>

    <ui:define name="pageTitle">#{labels.listUsuari_title}</ui:define>

    <ui:define name="breadcrumb">
        <p:menuitem value="#{labels.listUsuari_link}" outcome="/listUsuari" />
    </ui:define>

    <ui:define name="content">
        <p>
            <h:form>
                <p:dataTable id="dataTable" value="#{listUsuari.lazyModel}" var="usuari" sortMode="multiple"
                    paginator="true" lazy="true" filterDelay="300" widgetVar="unitatsTable" rows="10"
                    rowsPerPageTemplate="10,20,50,100" paginatorPosition="bottom" paginatorAlwaysVisible="false"
                    paginatorTemplate="{RowsPerPageLabel} {RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport}
                             {NextPageLink} {LastPageLink}"
                    currentPageReportTemplate="#{labels.dataTable_currentPageReport}"
                    emptyMessage="#{labels.dataTable_emptyMessage}">
                    <f:facet name="{RowsPerPageLabel}">
                        #{labels.dataTable_rowsPerPage}
                    </f:facet>
                    <!--  p:column sortBy="#{entitat.id}">
                        <f:facet name="header">#{labels.entitat_id}</f:facet>
                        <h:outputText value="#{entitat.id}"/>
                    </p:column -->

                    <p:column filterBy="#{usuari.username}" sortBy="#{usuari.username}">
                        <f:facet name="header">#{labels.usuari_username}</f:facet>
                        <h:outputText value="#{usuari.username}" />
                    </p:column>
                    <p:column filterBy="#{usuari.nom}" sortBy="#{usuari.nom}">
                        <f:facet name="header">#{labels.usuari_nom}</f:facet>
                        <h:outputText value="#{usuari.nom}" />
                    </p:column>
                    
                    <p:column filterBy="#{usuari.llinatge1}" sortBy="#{usuari.llinatge1}">
                        <f:facet name="header">#{labels.usuari_llinatge1}</f:facet>
                        <h:outputText value="#{usuari.llinatge1}" />
                    </p:column>
                    <p:column filterBy="#{usuari.llinatge2}" sortBy="#{usuari.llinatge2}">
                        <f:facet name="header">#{labels.usuari_llinatge2}</f:facet>
                        <h:outputText value="#{usuari.llinatge2}" />
                    </p:column>

                    <p:column>
                        <f:facet name="header"></f:facet>
                        <p:menuButton value="#{labels.button_opcions}">
                            <c:if test="#{security.admin}">
                                <p:menuitem value="#{labels.button_editar}" outcome="/admin/editUsuari">
                                    <f:param name="usuariId" value="#{usuari.usuariId}" />
                                </p:menuitem>
                                <p:menuitem value="#{labels.button_eliminar}" action="#{listUsuari.delete(usuari.usuariId)}"
                                    update="messages @form">
                                    <p:confirm message="#{labels.confirm_eliminar}" />
                                </p:menuitem>
                            </c:if>
                        </p:menuButton>
                    </p:column>
                </p:dataTable>
            </h:form>
        </p>
        <c:if test="#{security.admin}">
            <p>
                <p:button value="#{labels.newUsuari_link}" outcome="/admin/newUsuari" />
            </p>
        </c:if>
    </ui:define>
</ui:composition>
</html>
